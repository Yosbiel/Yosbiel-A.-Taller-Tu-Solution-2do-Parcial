name: tusolution
description: "Sistema de gestion para taller de reparaciones Tu Solution"
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Gestion de estado reactiva
  flutter_riverpod: ^2.4.9
  shared_preferences: ^2.2.2

  # Base de datos local (Drift y SQLite)
  drift: ^2.14.0
  sqlite3_flutter_libs: ^0.5.20
  path_provider: ^2.1.2
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Herramientas obligatorias para generar el codigo de Drift (.g.dart)
  build_runner: ^2.4.8
  drift_dev: ^2.14.0

flutter:
  uses-material-design: true

  # Fuentes Poppins bundleadas con la app.
  # Se usaran en el theme a partir de la Parte 3.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
